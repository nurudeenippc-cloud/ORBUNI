# Supabase CLI settings for the Orbuni project (ytsebzdykfeiiuxbdtvr).
# verify_jwt below mirrors what is LIVE (checked 23 Oct 2026). The CLI defaults
# verify_jwt to true, so deploying a webhook/cron function without this file would
# make Supabase reject Twilio, Paystack, Whop and pg_cron calls before our own checks run.
# Functions with verify_jwt = false do their own auth (signature, x-orb-secret or getUser()).
project_id = "ytsebzdykfeiiuxbdtvr"


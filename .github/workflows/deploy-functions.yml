# Deploys edge functions from this repo to the live Supabase project — only when started by hand
# (Actions → "Deploy edge functions" → Run workflow), never on push.
# verify_jwt for each function comes from supabase/config.toml, which mirrors the live settings.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access tokens).
name: Deploy edge functions
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Function names, separated by spaces (e.g. send-student-emails finance-write)"
        required: true

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ytsebzdykfeiiuxbdtvr
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Type-check what is about to ship
        working-directory: supabase/functions
        env:
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          for f in $FUNCTIONS; do
            test -f "$f/index.ts" || { echo "No function folder: $f"; exit 1; }
            deno check --no-lock "$f/index.ts"
          done

      - name: Deploy
        env:
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          for f in $FUNCTIONS; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
